name: Capture preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: capture-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ env.DEPLOY_SHA }}
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          cache: true
          version: 2026.8.6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          cache: gradle
          distribution: temurin
          java-version: '21'
      - name: Verify pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.5.0"
          test "$(npm --version)" = "11.5.2"
      - run: npm ci
      - name: Audit production npm dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build dormant synthetic PWA
        env:
          VITE_CAPTURE_E2E_MICROPHONE_ENABLED: 'false'
        run: npm run build
      - run: npm run check:preview-bundle
      - run: npm run cap:sync:check:android
      - name: Build debug APK
        working-directory: apps/capture/android
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Verify preview artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/capture/dist/index.html
          test -f apps/capture/dist/capture-preview-deployment.json
          test -f apps/capture/dist/sw.js
          test -f apps/capture/dist/manifest.webmanifest
          test -f apps/capture/dist/staticwebapp.config.json
          test -f apps/capture/android/app/build/outputs/apk/debug/app-debug.apk
          shasum -a 256 apps/capture/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload PWA build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          if-no-files-found: error
          name: capture-pwa-pr-${{ github.event.pull_request.number }}
          path: apps/capture/dist
          retention-days: 14
      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          if-no-files-found: error
          name: capture-android-debug-pr-${{ github.event.pull_request.number }}
          path: apps/capture/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
