name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cosmaneura_scribe_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cosmaneura_scribe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      COSMANEURA_SCRIBE_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cosmaneura_scribe_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest --cov=cosmaneura_scribe
      - run: uv run python scripts/check_phi_logs.py
      - run: uv run python scripts/check_secrets.py
      - run: uv run python scripts/check_adr_numbers.py
      - run: uv run python scripts/generate_openapi.py
      - run: git diff --exit-code -- openapi/openapi.json

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false
      - run: tofu fmt -check -recursive
        working-directory: infra
      - run: tofu init -backend=false
        working-directory: infra
      - run: tofu validate
        working-directory: infra
