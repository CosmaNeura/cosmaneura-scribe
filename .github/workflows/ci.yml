name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cosmaneura_scribe_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cosmaneura_scribe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      COSMANEURA_SCRIBE_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cosmaneura_scribe_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: '3.12'
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.5.0'
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest --cov=cosmaneura_scribe
      - run: uv run python scripts/check_phi_logs.py
      - run: uv run python scripts/check_secrets.py
      - run: uv run python scripts/check_adr_numbers.py
      - run: uv run python scripts/generate_openapi.py
      - run: git diff --exit-code -- openapi/openapi.json

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false
      - run: tofu fmt -check -recursive
        working-directory: infra
      - run: tofu init -backend=false
        working-directory: infra
      - run: tofu validate
        working-directory: infra

  capture-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.5.0'
      - run: npm install --global npm@11.5.2
      - run: npm ci
      - name: Audit production npm dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - run: npm run check:api
      - run: npm run test:golden
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:capture-preview-api
      - name: Select the supported preview Function runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
      - name: Verify the preview Function package under Node 22
        run: node apps/capture-preview-api/scripts/verify-runtime.mjs
      - name: Exercise preview Function source under Node 22
        shell: bash
        run: |
          set -euo pipefail
          (cd apps/capture-preview-api && node ../../node_modules/vitest/vitest.mjs run)
          (cd packages/capture-preview-domain && node ../../node_modules/vitest/vitest.mjs run)

  capture-android:
    needs: capture-web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.5.0'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm install --global npm@11.5.2
      - run: npm ci
      - run: npm run cap:sync:check:android
      - run: >-
          ./gradlew --no-daemon
          :cosmaneura-scribe-capacitor-secure-queue:testDebugUnitTest
          :app:assembleDebug
        working-directory: apps/capture/android
      - name: Free hosted-runner space for the API 36 emulator
        shell: bash
        run: |
          set -euo pipefail
          android_sdk_root="$(realpath -- "${ANDROID_HOME}")"
          if [[ "${android_sdk_root}" != "/usr/local/lib/android/sdk" ]]; then
            echo "::error::Unexpected hosted-runner Android SDK path"
            exit 1
          fi
          ndk_directory="${android_sdk_root}/ndk"
          if [[ -L "${ndk_directory}" ]]; then
            echo "::error::Refusing to remove a symlinked NDK directory"
            exit 1
          fi
          if [[ -d "${ndk_directory}" ]]; then
            du -sh "${ndk_directory}"
            sudo rm -rf -- /usr/local/lib/android/sdk/ndk
          fi
          df -h /
          available_kib="$(df --output=avail -k / | tail -1 | tr -d ' ')"
          if (( available_kib < 10485760 )); then
            echo "::error::Hosted runner has less than 10 GiB free for the API 36 emulator"
            exit 1
          fi
      - name: Enable Android emulator hardware acceleration
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -e /dev/kvm ]]; then
            echo "::error::GitHub runner does not expose /dev/kvm"
            exit 1
          fi
          sudo chmod 0666 /dev/kvm
      - name: Test Android secure queue on API 36
        shell: bash
        working-directory: apps/capture/android
        run: |
          set -euo pipefail

          sdkmanager_path="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          avdmanager_path="${ANDROID_HOME}/cmdline-tools/latest/bin/avdmanager"
          emulator_path="${ANDROID_HOME}/emulator/emulator"
          adb_path="${ANDROID_HOME}/platform-tools/adb"
          system_image="system-images;android-36;google_apis;x86_64"
          avd_name="cosmaneura-api36"
          avd_home="${RUNNER_TEMP}/cosmaneura-api36-avd"
          mkdir -p "${avd_home}"
          export ANDROID_AVD_HOME="${avd_home}"

          "${sdkmanager_path}" --install "${system_image}"
          printf 'no\n' | "${avdmanager_path}" create avd \
            --force \
            --name "${avd_name}" \
            --package "${system_image}" \
            --device pixel_2
          if [[ ! -f "${ANDROID_AVD_HOME}/${avd_name}.ini" ]]; then
            echo "::error::avdmanager did not create the expected API 36 AVD metadata"
            exit 1
          fi
          avd_config="${ANDROID_AVD_HOME}/${avd_name}.avd/config.ini"
          if [[ ! -f "${avd_config}" ]]; then
            echo "::error::avdmanager did not create the expected API 36 AVD configuration"
            exit 1
          fi
          if grep -q '^disk\.dataPartition\.size=' "${avd_config}"; then
            sed -i 's/^disk\.dataPartition\.size=.*/disk.dataPartition.size=2048M/' "${avd_config}"
          else
            printf '%s\n' 'disk.dataPartition.size=2048M' >> "${avd_config}"
          fi
          grep -Fxq 'disk.dataPartition.size=2048M' "${avd_config}"

          cleanup() {
            "${adb_path}" emu kill >/dev/null 2>&1 || true
            kill "${emulator_pid:-}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          nohup "${emulator_path}" \
            -avd "${avd_name}" \
            -partition-size 2048 \
            -no-window \
            -no-snapshot \
            -noaudio \
            -no-metrics \
            -no-boot-anim \
            -accel on \
            -gpu swiftshader_indirect \
            >"${RUNNER_TEMP}/cosmaneura-api36-emulator.log" 2>&1 &
          emulator_pid=$!

          if ! timeout 180s "${adb_path}" wait-for-device; then
            echo "::error::API 36 emulator did not become visible to adb within 180 seconds"
            tail -80 "${RUNNER_TEMP}/cosmaneura-api36-emulator.log"
            exit 1
          fi
          boot_completed=""
          for _attempt in $(seq 1 60); do
            boot_completed="$("${adb_path}" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            if [[ "${boot_completed}" == "1" ]]; then
              break
            fi
            sleep 5
          done
          if [[ "${boot_completed}" != "1" ]]; then
            echo "::error::API 36 emulator did not boot within 300 seconds"
            tail -80 "${RUNNER_TEMP}/cosmaneura-api36-emulator.log"
            exit 1
          fi

          "${adb_path}" shell settings put global window_animation_scale 0
          "${adb_path}" shell settings put global transition_animation_scale 0
          "${adb_path}" shell settings put global animator_duration_scale 0
          ./gradlew --no-daemon \
            :cosmaneura-scribe-capacitor-secure-queue:connectedDebugAndroidTest

  capture-ios:
    needs: capture-web
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.5.0'
      - run: npm install --global npm@11.5.2
      - run: npm ci
      - run: npm run cap:sync:check:ios
      - name: Test iOS secure queue
        run: >-
          xcodebuild test
          -project ios/Tests/SecureQueueHostedTests.xcodeproj
          -scheme SecureQueueHostedTests
          -configuration Debug
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest'
        working-directory: apps/capture/native-plugins/secure-queue
      - run: >-
          xcodebuild
          -project apps/capture/ios/App/App.xcodeproj
          -scheme App
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
