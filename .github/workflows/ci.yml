name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cosmaneura_scribe_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cosmaneura_scribe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      COSMANEURA_SCRIBE_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cosmaneura_scribe_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.5.0'
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest --cov=cosmaneura_scribe
      - run: uv run python scripts/check_phi_logs.py
      - run: uv run python scripts/check_secrets.py
      - run: uv run python scripts/check_adr_numbers.py
      - run: uv run python scripts/generate_openapi.py
      - run: git diff --exit-code -- openapi/openapi.json

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false
      - run: tofu fmt -check -recursive
        working-directory: infra
      - run: tofu init -backend=false
        working-directory: infra
      - run: tofu validate
        working-directory: infra

  capture-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.5.0'
      - run: npm install --global npm@11.5.2
      - run: npm ci
      - run: npm run check:api
      - run: npm run test:golden
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  capture-android:
    needs: capture-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.5.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm install --global npm@11.5.2
      - run: npm ci
      - run: npm run cap:sync:check:android
      - run: >-
          ./gradlew --no-daemon
          :cosmaneura-scribe-capacitor-secure-queue:testDebugUnitTest
          :app:assembleDebug
        working-directory: apps/capture/android

  capture-ios:
    needs: capture-web
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.5.0'
      - run: npm install --global npm@11.5.2
      - run: npm ci
      - run: npm run cap:sync:check:ios
      - name: Test iOS secure queue
        run: >-
          xcodebuild test
          -scheme CosmaneuraSecureQueue
          -configuration Debug
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest'
          PRODUCT_BUNDLE_IDENTIFIER=com.cosmaneura.capture.securequeuetests
          CODE_SIGN_ENTITLEMENTS=ios/Tests/CosmaneuraSecureQueueTests/CosmaneuraSecureQueueTests.entitlements
        working-directory: apps/capture/native-plugins/secure-queue
      - run: >-
          xcodebuild
          -project apps/capture/ios/App/App.xcodeproj
          -scheme App
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
